data:
  path_h5p: "data/test.h5"
  path_npy: "data/decomp/test/pixels.npy"
  num_workers: 8
  ckpt_path: "checkpoints/"
  eval_part: 0.1 # training part = 1-eval_part
  Ks: [5, 25, 125]

train:
  batch_size: 128
  epochs: 50
  use_bf16: False
  lr: 1.5e-4
  seed: 42
  warmup_epochs: 5
  weight_decay: 1e-4
  resume: False # if you want to start from a checkpoint

model:
  emb_dims: [192] # it gives the number of hierachical level
  sigreg_coef: 0.04
  n_head: 4
  n_block: 4
  dropout_p: 0.1
  enc_depth: 3 # encoder depth on
  z_below_detach: False # !TEST! -> if True z_below is detach on encoding
  planning:
    k : 32
    n_euler_step: 8
    n_rollout_step: 5
    n_gd_step: 5
    lr_for_gd: 0.05
    lambda_prox: 0.01
    a_max: 3.0