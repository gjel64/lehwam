data:
  path_h5p: "data/test.h5"
  path_npy: "data/decomp/test/pixels.npy"
  num_workers: 8
  ckpt_path: "checkpoints/test.pt"

train:
  batch_size: 32
  epochs: 2
  use_bf16: True

model:
  emb_dim: 192
  sigreg_coef: 0.04
  planning:
    k : 32
    n_euler_step: 8
    n_rollout_step: 5
    n_gd_step: 5
    lr_for_gd: 0.05
    lambda_prox: 0.01
    a_max: 3.0